name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and run tests with Docker Compose
        run: |
          docker compose up --build --abort-on-container-exit

      - name: Login and Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-api-app:latest -t ${{ secrets.DOCKER_USERNAME }}/my-api-app:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/my-api-app --all-tags
          