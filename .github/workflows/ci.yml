name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my-api-app:${{ github.sha }} ./app

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests with Docker Compose
        run: |
          docker compose up --build -d
          docker compose exec -T api pytest

      - name: Stop containers
        if: always()
        run: docker compose down

  push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and Push tags
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-api-app:latest -t ${{ secrets.DOCKER_USERNAME }}/my-api-app:${{ github.sha }} ./app
          docker push ${{ secrets.DOCKER_USERNAME }}/my-api-app --all-tags

  deploy:
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        run: |
          # שלב הדפלוי שמדמה משיכת האימג' המעודכן והפעלתו
          docker compose pull
          docker compose up -d
          