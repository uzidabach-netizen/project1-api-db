server {
    listen 80;

    # הגשת קבצים סטטיים (index.html)
    location / {
        root /usr/share/nginx/html/static;
        index index.html;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    # ניתוב בקשות ה-API ל-FastAPI
    location /api/ {
        proxy_pass http://api:8000/;
    }
}

